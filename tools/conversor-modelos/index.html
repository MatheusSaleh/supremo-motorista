<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Conversor de modelos — Supremo Motorista</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 24px; background: #1d2228; color: #e8eaed; }
      textarea { width: 100%; height: 320px; font: 12px ui-monospace, monospace; background: #111418; color: #e8eaed; }
      button { padding: 8px 16px; margin: 8px 8px 8px 0; font-weight: 700; }
      pre { background: #111418; padding: 12px; white-space: pre-wrap; }
      img { width: 45%; margin: 4px; border: 1px solid #444; }
      a { color: #ffd34d; }
    </style>
  </head>
  <body>
    <h1>Conversor de modelos</h1>
    <p>
      Coloque o .glb de origem em <code>tools/conversor-modelos/entrada/</code>, cole a configuração (veja
      <code>exemplos/</code> e <code>docs/ASSETS.md</code>) e clique no botão. Os arquivos gerados aparecem para
      download e devem ir para <code>public/models/</code>.
    </p>
    <textarea id="cfg" spellcheck="false"></textarea>
    <div>
      <button id="car">Converter carro</button>
      <button id="char">Montar personagem</button>
    </div>
    <pre id="log"></pre>
    <div id="out"></div>
    <script type="module" src="./convert.js"></script>
    <script type="module" src="./chars.js"></script>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const log = (s) => ($('log').textContent += s + '\n');
      const download = (name, b64, type = 'model/gltf-binary') => {
        const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type }));
        a.download = name;
        a.textContent = `baixar ${name} (${(bytes.length / 1e6).toFixed(2)} MB)`;
        $('out').append(a, document.createElement('br'));
      };
      const images = (shots, prefix) => {
        for (const [k, url] of Object.entries(shots ?? {})) {
          const img = new Image();
          img.src = url;
          img.title = `${prefix} ${k}`;
          $('out').append(img);
        }
      };
      const run = async (fn) => {
        $('log').textContent = '';
        $('out').textContent = '';
        try {
          await fn(JSON.parse($('cfg').value));
        } catch (e) {
          log('ERRO: ' + (e?.stack ?? e));
        }
      };
      $('car').onclick = () =>
        run(async (cfg) => {
          log('convertendo…');
          const r = await window.convert(cfg);
          r.log.forEach(log);
          for (const [label, o] of Object.entries(r.results)) {
            if (o.glb) download(`${label}.glb`, o.glb);
            log(`${label}: ${o.tris} triângulos`);
            images(o.shots, label);
          }
        });
      $('char').onclick = () =>
        run(async (cfg) => {
          log('montando personagem…');
          const r = await window.buildCharacter(cfg);
          r.log.forEach(log);
          download('personagem.glb', r.glb);
          images(r.shots, 'pose');
        });
      fetch('./exemplos/fusion.json')
        .then((r) => r.text())
        .then((t) => ($('cfg').value = t));
    </script>
  </body>
</html>
