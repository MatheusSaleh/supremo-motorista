# Mantém iguais os dois repositórios do projeto (MatheusSaleh/supremo-motorista e
# nexolabs-dev/supremo-motorista). Este arquivo existe nos dois, então um push em qualquer um deles
# atualiza o outro. Não entra em loop: quando os dois já estão iguais, o sync não envia nada.
#
# Requer o segredo SYNC_TOKEN cadastrado NOS DOIS repositórios (Settings → Secrets and variables →
# Actions): um token fine-grained com acesso aos dois repositórios e permissão "Contents: Read and write".
# Sem o segredo, o workflow só avisa e termina sem erro.
name: Sincronizar repositórios

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

# Um sync por vez em cada repositório (pushes seguidos esperam o anterior terminar).
concurrency:
  group: sync-repos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sincronizar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o sync compara commits para só avançar (fast-forward)
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apagar a branch no outro repositório
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BRANCH: ${{ github.event.ref }}
        run: node scripts/sync-repos.mjs --delete "$BRANCH"

      - name: Sincronizar branches
        if: github.event_name != 'delete'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node scripts/sync-repos.mjs
